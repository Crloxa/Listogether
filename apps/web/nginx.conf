# Listogether web 站点：SPA 静态托管 + Relay 同源反代。
# /api/* 与 /ws 转发到 relay 服务（WebSocket 需要升级头），其余走 SPA fallback。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 健康检查：首页的"Relay 已连接"探测走这里
  location = /healthz {
    proxy_pass http://relay:8080;
    proxy_set_header Host $host;
  }

  # 房间 REST API 与 OAuth（含回调）——同源转发，浏览器无跨域问题
  location /api/ {
    proxy_pass http://relay:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
  }

  # WebSocket 控制通道：长连接，读超时要远大于心跳间隔（客户端 15s 心跳）
  location /ws {
    proxy_pass http://relay:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA 路由（/、/join、/room/<id>）全部回退到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存：带内容哈希的 assets 长缓存，HTML 不缓存保证发版即生效
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
